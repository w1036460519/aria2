name: build-multi-platform

# 多平台构建 + 闭环验证
# 触发：push 到主分支 / PR / 手动 / tag (v*)
# 产物：每个平台/架构上传为独立 artifact；打 tag 时聚合为 GitHub Release。

on:
  push:
    branches: [ master, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write   # release job 需要写权限

jobs:
  # ============================================================
  # macOS arm64 (Apple Silicon)
  # GitHub Hosted Intel runner (macos-13) 已 EOL,
  # 公共免费池里只剩 arm64; x86_64 需要付费 larger runner
  # 或 self-hosted Intel。本仓库决定只发 arm64。
  # ============================================================
  macos:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          brew install autoconf automake libtool pkg-config gettext \
                       c-ares libssh2 libxml2 sqlite

      - name: Bootstrap
        run: autoreconf -i

      - name: Configure & Build
        run: |
          mkdir -p build && cd build
          # Apple clang++ 默认 -std=c++98, configure.ac 调用
          # AX_CXX_COMPILE_STDCXX 第二参为空只测 default, 会误报
          # 不支持 C++11; 同时 configure.ac 会清空 CXXFLAGS,
          # 所以 -std=gnu++14 必须绑进 $CXX 本身。
          export CC=/usr/bin/clang
          export CXX="/usr/bin/clang++ -std=gnu++14"
          ../configure \
            --enable-libaria2 --enable-static --disable-nls \
            --with-appletls --without-gnutls --without-openssl
          make -j"$(sysctl -n hw.ncpu)"

      - name: Verify (L2 + L3)
        run: |
          bash scripts/verify.sh macos arm64 build

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-arm64
          path: |
            build/src/.libs/aria2c
            build/src/.libs/libaria2.*
          if-no-files-found: error
          # .libs 是隐藏目录, upload-artifact@v4 默认会跳过
          include-hidden-files: true

  # ============================================================
  # Linux (x86_64 + arm64) — manylinux2014 容器保证 glibc 兼容
  # ============================================================
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: quay.io/pypa/manylinux2014_x86_64
            qemu:  ''
          - arch: arm64
            image: quay.io/pypa/manylinux2014_aarch64
            qemu:  arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64)
        if: matrix.qemu != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu }}

      - name: Build inside manylinux container
        run: |
          docker run --rm \
            ${{ matrix.qemu != '' && '--platform linux/arm64' || '' }} \
            -v "$PWD":/work -w /work \
            ${{ matrix.image }} \
            bash -c '
              set -e
              yum install -y openssl-devel libxml2-devel zlib-devel \
                             expat-devel sqlite-devel libssh2-devel \
                             c-ares-devel gettext-devel
              autoreconf -i
              mkdir -p build && cd build
              ../configure \
                --enable-libaria2 --with-openssl --disable-nls \
                ARIA2_STATIC=yes
              make -j"$(nproc)"
              # libtool 启用共享库时真二进制在 .libs/, src/aria2c 是 wrapper。
              # 在容器内 src/aria2c 可用(wrapper 会 set LD_LIBRARY_PATH 后 exec
              # .libs/aria2c),所以容器内 L3 还是调 src/aria2c。
              file src/.libs/aria2c
              src/aria2c --version | head -3
            '

      - name: Verify (L2 + L3)
        run: |
          bash scripts/verify.sh linux ${{ matrix.arch }} build

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-linux-${{ matrix.arch }}
          path: |
            build/src/.libs/aria2c
            build/src/.libs/libaria2.*
          if-no-files-found: error
          # .libs 是隐藏目录, upload-artifact@v4 默认会跳过
          include-hidden-files: true

  # ============================================================
  # Windows x86_64 — 复用项目自带 Dockerfile.mingw
  # ============================================================
  windows-x64:
    name: windows-x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Patch Dockerfile (gmplib.org 从 runner 常访问超时)
        run: |
          cp Dockerfile.mingw Dockerfile.mingw.ci
          # gmplib.org IP 段在 GitHub Actions runner 上经常不可达;
          # GMP 在 GNU 官方镜像有完整文件, 换过去即可。
          sed -i 's|https://gmplib.org/download/gmp/|https://ftp.gnu.org/gnu/gmp/|g' Dockerfile.mingw.ci
          grep -n 'gmp-' Dockerfile.mingw.ci

      - name: Build via Dockerfile.mingw (x86_64)
        run: |
          docker build \
            --build-arg HOST=x86_64-w64-mingw32 \
            --build-arg ARIA2_VERSION=master \
            -f Dockerfile.mingw.ci -t aria2-mingw-x64 .

      - name: Extract artifacts
        run: |
          id=$(docker create aria2-mingw-x64)
          mkdir -p out
          # mingw+libtool 亦可能产 wrapper, 优先拷 .libs/ 里的真 exe
          docker cp "$id":/aria2/src/.libs/aria2c.exe out/aria2c.exe 2>/dev/null \
            || docker cp "$id":/aria2/src/aria2c.exe out/aria2c.exe
          docker rm "$id"
          file out/aria2c.exe

      - name: Verify (L2)
        run: bash scripts/verify.sh windows x86_64 out

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-windows-x86_64
          path: out/aria2c.exe
          if-no-files-found: error

  # ============================================================
  # Windows arm64 — llvm-mingw 工具链
  # ============================================================
  windows-arm64:
    name: windows-arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build inside llvm-mingw container
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            mstorsjo/llvm-mingw:latest \
            bash -c '
              set -e
              apt-get update && apt-get install -y \
                autoconf automake libtool pkg-config make \
                autopoint gettext python3 curl ca-certificates
              export HOST=aarch64-w64-mingw32
              export PREFIX=/usr/local/$HOST
              mkdir -p $PREFIX
              # 编译核心依赖（zlib/expat/c-ares/libssh2）
              bash scripts/build-windows-arm64-deps.sh
              autoreconf -i
              mkdir -p build && cd build
              ../configure \
                --host=$HOST \
                --enable-libaria2 --disable-nls \
                --without-gnutls --without-openssl --with-wintls \
                --without-libxml2 --with-libexpat \
                --without-sqlite3 \
                --with-libcares --with-libz --with-libssh2 \
                ARIA2_STATIC=yes \
                CFLAGS="-Os" CXXFLAGS="-Os" \
                CPPFLAGS="-I$PREFIX/include" \
                LDFLAGS="-L$PREFIX/lib" \
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
              make -j"$(nproc)"
              # libtool 可能产 wrapper, 真 exe 在 .libs/
              REAL=src/.libs/aria2c.exe
              [ -f "$REAL" ] || REAL=src/aria2c.exe
              ${HOST}-strip "$REAL" || true
              mkdir -p /work/out-arm64
              cp "$REAL" /work/out-arm64/aria2c.exe
              file /work/out-arm64/aria2c.exe
            '

      - name: Verify (L2)
        run: bash scripts/verify.sh windows arm64 out-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-windows-arm64
          path: out-arm64/aria2c.exe
          if-no-files-found: error

  # ============================================================
  # Android — 多 ABI (arm64-v8a / armeabi-v7a / x86_64 / x86)
  # ============================================================
  android:
    name: android-${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            host: aarch64-linux-android
            openssl_target: android-arm64
          - abi: armeabi-v7a
            host: armv7a-linux-androideabi
            openssl_target: android-arm
          - abi: x86_64
            host: x86_64-linux-android
            openssl_target: android-x86_64
          - abi: x86
            host: i686-linux-android
            openssl_target: android-x86
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: r25c
      API: '33'
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip make autoconf automake libtool \
            pkg-config autopoint gettext dpkg-dev curl

      - name: Setup NDK
        run: |
          curl -L -O https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "NDK=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Build aria2 for ${{ matrix.abi }}
        run: |
          bash scripts/build-android.sh \
            "${{ matrix.host }}" \
            "${{ matrix.openssl_target }}" \
            "${{ matrix.abi }}"

      - name: Verify (L2)
        run: bash scripts/verify.sh android ${{ matrix.abi }} android-out/${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-android-${{ matrix.abi }}
          path: android-out/${{ matrix.abi }}/
          if-no-files-found: error

  # ============================================================
  # iOS — arm64 真机 + arm64 模拟器 + x86_64 模拟器
  # 输出 aria2.xcframework
  # ============================================================
  ios:
    name: ios-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: device-arm64
            sdk: iphoneos
            arch: arm64
          - target: simulator-arm64
            sdk: iphonesimulator
            arch: arm64
          - target: simulator-x86_64
            sdk: iphonesimulator
            arch: x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          brew install autoconf automake libtool pkg-config gettext

      - name: Cross-compile dependencies (zlib/expat/c-ares/libssh2)
        run: bash scripts/ios/build-deps.sh ${{ matrix.sdk }} ${{ matrix.arch }}

      - name: Build aria2 static lib
        run: bash scripts/ios/build-aria2.sh ${{ matrix.sdk }} ${{ matrix.arch }}

      - name: Verify (L2)
        run: |
          OUT=ios-out/${{ matrix.sdk }}-${{ matrix.arch }}
          bash scripts/verify.sh ios ${{ matrix.arch }} "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ios-${{ matrix.target }}
          path: ios-out/${{ matrix.sdk }}-${{ matrix.arch }}/
          if-no-files-found: error

  ios-xcframework:
    name: ios-xcframework
    needs: ios
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aria2-ios-device-arm64
          path: in/device-arm64
      - uses: actions/download-artifact@v4
        with:
          name: aria2-ios-simulator-arm64
          path: in/simulator-arm64
      - uses: actions/download-artifact@v4
        with:
          name: aria2-ios-simulator-x86_64
          path: in/simulator-x86_64

      - name: Merge simulator slices via lipo
        run: |
          mkdir -p sim-merged/lib sim-merged/include
          lipo -create \
            in/simulator-arm64/lib/libaria2.a \
            in/simulator-x86_64/lib/libaria2.a \
            -output sim-merged/lib/libaria2.a
          cp -R in/simulator-arm64/include/. sim-merged/include/

      - name: Create xcframework
        run: |
          xcodebuild -create-xcframework \
            -library in/device-arm64/lib/libaria2.a \
            -headers in/device-arm64/include \
            -library sim-merged/lib/libaria2.a \
            -headers sim-merged/include \
            -output aria2.xcframework
          ls -la aria2.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: aria2-ios-xcframework
          path: aria2.xcframework

  # ============================================================
  # 聚合发布（仅 tag 触发）
  # ============================================================
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos
      - linux
      - windows-x64
      - windows-arm64
      - android
      - ios-xcframework
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List dist
        run: ls -la dist
      - name: Pack each platform
        run: |
          cd dist
          for d in */; do
            name="${d%/}"
            tar czf "../${name}.tar.gz" "$d"
          done
          ls -la ..
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
